name: VNDK Check

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/vndk-check'

jobs:
  vndk-check:
    name: Report r9q2 device codename
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Dump device codename from G990B2 firmware
        run: |
          set +e
          W="$GITHUB_WORKSPACE"
          [ -d "$W/out" ] || W="$HOME/actions-runner/_work/MonsterROM/MonsterROM"
          cd "$W" || exit 0
          echo "=== ro.product.*.device / model / name in extracted G990B2 firmware ==="
          find out -path '*SM-G990B2*' -name 'build.prop' 2>/dev/null | while read -r p; do
            grep -HoE 'ro\.product\.(vendor|odm|system|product|system_ext)?\.?(device|model|name)=[A-Za-z0-9_-]+' "$p"
          done | sort -u
          echo "=== ro.build.product / ro.boot.em.model / bootimage ==="
          find out -path '*SM-G990B2*' -name '*.prop' 2>/dev/null | while read -r p; do
            grep -HoE 'ro\.build\.product=[A-Za-z0-9_-]+|ro\.boot\.em\.model=[A-Za-z0-9/_-]+|ro\.product\.board=[A-Za-z0-9_-]+' "$p"
          done | sort -u
          echo "Done."
