name: CI

# The build job runs on a self-hosted runner, so pull_request is NOT a
# trigger: on a public repo it would let anyone execute code from a fork
# on the runner machine. Restore it only if build moves back to a
# GitHub-hosted runner.
on:
  workflow_dispatch:
  push:
    branches:
      - 'sixteen'
      - 'seventeen'
      - 'claude/sm-g990b2-snapdragon-build-tccz4v'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Generate CI matrix
        id: generate-matrix
        run: |
          # This fork only builds the SM-G990B2 target. Keeping the matrix
          # explicit avoids a second repository checkout before the build.
          matrix='["r9q2"]'
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: generate-matrix
    # Self-hosted so out/odin and out/fw survive between runs: the build
    # system's .downloaded/.extracted markers then skip the ~15GB firmware
    # download and go straight to building.
    # Host prerequisites are installed once by hand, not per run; see
    # docs/self-hosted-runner.md.
    runs-on: [self-hosted, linux, x64]

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          # Required: the default (clean: true) runs `git clean -ffdx`,
          # and -x deletes ignored files - which would wipe out/ and the
          # cached firmware on every run, defeating the whole point.
          clean: false

      # NOTE: the "Free disk space" steps used by GitHub-hosted runners are
      # deliberately absent. They rm -rf /usr/share/dotnet, /opt/ghc and
      # friends, which would damage a real machine.

      - name: Set up build environment
        run: |
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      # Only the source (system) firmware is downloaded here. The r9q2 target
      # firmware is pinned to the unlockable F base and imported from a local
      # archive in the next step, so --ignore-target avoids samloader resolving
      # and downloading the *latest* SM-G990B2 firmware (a different, newer
      # base) on every run only for the pin step to overwrite it.
      # Skipped automatically when out/odin already holds the source firmware.
      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh --ignore-target

      - name: Import pinned r9q2 target firmware
        if: matrix.target == 'r9q2'
        env:
          PINNED_TARGET_FIRMWARE: G990B2XXSFHYI1/G990B2OXMFHYI1/G990B2XXSFHYI1
          TARGET_AP_ARCHIVE: /mnt/c/Users/Josh/Downloads/AP_G990B2XXSFHYI1_G990B2XXSFHYI1_MQB100770420_REV00_user_low_ship_MULTI_CERT_meta_OS15.tar.md5.zip
          TARGET_BL_ARCHIVE: /mnt/c/Users/Josh/Downloads/BL_G990B2XXSFHYI1_G990B2XXSFHYI1_MQB100770420_REV00_user_low_ship_MULTI_CERT.tar.md5.zip
        run: |
          target_odin_dir="$ODIN_DIR/SM-G990B2_EUX"
          target_fw_dir="$FW_DIR/SM-G990B2_EUX"

          if [ -f "$target_fw_dir/.extracted" ] &&
              [ "$(cat "$target_fw_dir/.extracted")" = "$PINNED_TARGET_FIRMWARE" ]; then
            echo "Pinned target firmware is already extracted"
            exit 0
          fi

          for archive in "$TARGET_AP_ARCHIVE" "$TARGET_BL_ARCHIVE"; do
            if [ ! -f "$archive" ]; then
              echo "::error::Pinned target firmware archive not found: $archive"
              exit 1
            fi
            unzip -tq "$archive"
          done

          if [ "$target_odin_dir" != "$ODIN_DIR/SM-G990B2_EUX" ] ||
              [ "$target_fw_dir" != "$FW_DIR/SM-G990B2_EUX" ]; then
            echo "::error::Refusing to replace an unexpected firmware cache path"
            exit 1
          fi

          rm -rf -- "$target_odin_dir" "$target_fw_dir"
          mkdir -p "$target_odin_dir"
          unzip -j -o "$TARGET_AP_ARCHIVE" '*.tar.md5' -d "$target_odin_dir"
          unzip -j -o "$TARGET_BL_ARCHIVE" '*.tar.md5' -d "$target_odin_dir"

          while IFS= read -r package; do
            file_name="$(basename "${package%.md5}")"
            footer_length="$((32 + 2 + ${#file_name} + 1))"
            stored_hash="$(tail -c "$footer_length" "$package" | cut -d " " -f 1 -s)"
            calculated_hash="$(head -c-"$footer_length" "$package" | md5sum | cut -d " " -f 1 -s)"
            if [ "${#stored_hash}" -ne 32 ] || [ "$stored_hash" != "$calculated_hash" ]; then
              echo "::error::Samsung MD5 verification failed: $(basename "$package")"
              exit 1
            fi
          done < <(find "$target_odin_dir" -type f -name '*.md5')

          printf '%s' "$PINNED_TARGET_FIRMWARE" > "$target_odin_dir/.downloaded"

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh -z
