name: CI

# The build job runs on a self-hosted runner, so pull_request is NOT a
# trigger: on a public repo it would let anyone execute code from a fork
# on the runner machine. Restore it only if build moves back to a
# GitHub-hosted runner.
on:
  workflow_dispatch:
  push:
    branches:
      - 'sixteen'
      - 'seventeen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Generate CI matrix
        id: generate-matrix
        run: |
          # This fork only builds the SM-G990B2 target. Keeping the matrix
          # explicit avoids a second repository checkout before the build.
          matrix='["r9q2"]'
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: generate-matrix
    # Self-hosted so out/odin and out/fw survive between runs: the build
    # system's .downloaded/.extracted markers then skip the ~15GB firmware
    # download and go straight to building.
    # Host prerequisites are installed once by hand, not per run; see
    # docs/self-hosted-runner.md.
    runs-on: [self-hosted, linux, x64]

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          # Required: the default (clean: true) runs `git clean -ffdx`,
          # and -x deletes ignored files - which would wipe out/ and the
          # cached firmware on every run, defeating the whole point.
          clean: false

      # NOTE: the "Free disk space" steps used by GitHub-hosted runners are
      # deliberately absent. They rm -rf /usr/share/dotnet, /opt/ghc and
      # friends, which would damage a real machine.

      - name: Set up build environment
        run: |
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      # Skipped automatically when out/odin already holds this firmware.
      # The timeout covers BOTH firmwares (source + target) plus unzip and
      # md5 verification: on a cold cache that is well over 30GB, and 60
      # minutes was not enough to finish the second one.
      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh
